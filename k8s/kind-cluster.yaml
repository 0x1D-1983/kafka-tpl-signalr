# Node (pricestream.io/pool=app): PriceStream, edge Envoy, and Kafka.
# The edge NodePort is published as localhost:8080.
# kind nodes share the host's CPU/RAM, so budgets are the pod requests/limits, not the node size.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: pricestream
nodes:
  - role: control-plane
  - role: worker
    labels:
      pricestream.io/pool: app
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: 127.0.0.1
        protocol: TCP
