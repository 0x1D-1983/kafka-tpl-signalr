apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: pricestream
build:
  tagPolicy:
    inputDigest: {}
  artifacts:
    - image: pricestream
      context: PriceStream
      docker:
        dockerfile: Dockerfile
  local:
    push: false
manifests:
  kustomize:
    paths:
      - k8s
deploy:
  kubectl: {}
# Developer access to the PriceStream Service, bypassing the edge (so /health/* is reachable too).
# The public edge is on localhost:8080 via the kind port mapping.
portForward:
  - resourceType: service
    resourceName: pricestream
    namespace: pricestream
    port: 80
    localPort: 8081
  # Prometheus UI; firing alerts are on /alerts.
  - resourceType: service
    resourceName: prometheus
    namespace: pricestream
    port: 9090
    localPort: 9090
  # Grafana; the PriceStream dashboard is the home page.
  - resourceType: service
    resourceName: grafana
    namespace: pricestream
    port: 3000
    localPort: 3000
